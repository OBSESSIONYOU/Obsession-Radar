name: Daily Radar Update

# Daily updates use a reviewed PR instead of writing directly to main.
on:
  schedule:
    - cron: "30 0 * * *" # 08:30 北京时间
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: daily-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install upload guard and prepare update branch
        run: |
          python scripts/privacy_guard.py install
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=automation/daily-radar-update
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git switch -c "$branch"
          fi

      - name: Run daily radar update
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: node run-demo.mjs
      - name: Rebuild history archive
        run: node scripts/build-history.mjs

      - name: Commit guarded update and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add daily-radar.json daily-radar.md demo-data.js last-run.json last-run-data.js history.json
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
          else
            git commit -m "chore: daily radar update $(date -u +%F)"
            git push --set-upstream origin automation/daily-radar-update
            number=$(gh pr list --head automation/daily-radar-update --base main --state open --json number --jq '.[0].number // empty')
            if [ -z "$number" ]; then
              cat > "$RUNNER_TEMP/radar-update-body.md" <<'BODY'
          Refresh daily public research summaries. Local upload checks run before the bot pushes this update.

          Review the changes and merge after CI and Privacy Guard pass. This workflow does not approve or merge its own PR.
          BODY
              gh pr create --base main --head automation/daily-radar-update --title "chore: daily radar update" --body-file "$RUNNER_TEMP/radar-update-body.md"
            fi
            # Explicit dispatch ensures checks run for the bot-created branch.
            gh workflow run ci.yml --ref automation/daily-radar-update
            gh workflow run privacy-guard.yml --ref automation/daily-radar-update
          fi
