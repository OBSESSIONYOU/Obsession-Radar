<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsession Radar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFD84D'/%3E%3Cpath d='M36 4 14 36h16l-5 24 25-36H34z' fill='%23211A12'/%3E%3Ccircle cx='49' cy='14' r='7' fill='%23E64B3C'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7ef;
        --paper: #fffdf4;
        --panel: #ffffff;
        --surface: #f8fbff;
        --ink: #211a12;
        --muted: #665c4a;
        --line: #2c251b;
        --soft-line: #e4dfc8;
        --electric: #ffd84d;
        --electric-soft: #fff1a6;
        --spark: #e64b3c;
        --blue: #4b6bff;
        --blue-soft: #eef2ff;
        --amber: #9a5b00;
        --ok: #087f5b;
        --shadow: 4px 4px 0 #211a12;
        --soft-shadow: 0 10px 30px rgba(33, 26, 18, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(33, 26, 18, 0.05) 1px, transparent 1px),
          linear-gradient(180deg, rgba(33, 26, 18, 0.05) 1px, transparent 1px),
          var(--bg);
        background-size: 32px 32px;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1240px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 18px 0 44px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: clamp(1.5rem, 3.2vw, 2.4rem);
        line-height: 1;
        font-weight: 900;
      }

      h2 {
        font-size: 1rem;
      }

      .brand {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 13px;
        align-items: center;
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        border: 3px solid var(--ink);
        border-radius: 8px;
        background: var(--electric);
        box-shadow: var(--shadow);
        display: grid;
        place-items: center;
        position: relative;
      }

      .brand-mark::before {
        content: "";
        width: 24px;
        height: 36px;
        background: var(--ink);
        clip-path: polygon(62% 0, 10% 56%, 45% 56%, 31% 100%, 92% 38%, 55% 38%);
      }

      .brand-mark::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        right: 6px;
        top: 6px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--spark);
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-weight: 700;
      }

      button {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        padding: 0 14px;
        cursor: pointer;
      }

      button.primary {
        background: var(--electric);
        border-width: 2px;
        border-color: var(--ink);
        color: var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(75, 107, 255, 0.35);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      button.is-active {
        border-color: var(--ink);
        background: var(--electric-soft);
        color: var(--ink);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .toolbar-actions {
        display: grid;
        gap: 9px;
        justify-items: end;
        min-width: min(360px, 100%);
        padding: 10px;
        border: 1px solid var(--soft-line);
        border-radius: 8px;
        background: #fffaf0;
      }

      .toolbar-actions .primary {
        min-height: 48px;
        padding-inline: 18px;
      }

      .export-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .export-actions button {
        min-height: 34px;
        padding: 0 10px;
        font-size: 0.86rem;
        background: var(--paper);
      }

      .status {
        color: var(--muted);
        margin-top: 6px;
        font-size: 0.95rem;
      }

      .status-secondary {
        margin-top: 4px;
        font-size: 0.86rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0 10px;
      }

      .metric,
      .panel,
      .recommendation,
      .topic-card {
        background: var(--panel);
        border: 1px solid var(--soft-line);
        border-radius: 8px;
      }

      .panel {
        box-shadow: var(--soft-shadow);
      }

      .metric {
        padding: 12px 14px;
        border-color: var(--line);
        background: var(--paper);
      }

      .metric span,
      .story-meta,
      .candidate-list span,
      .candidate-list em {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 1.45rem;
        line-height: 1;
      }

      .source-health {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 0 14px;
      }

      .source-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--muted);
        padding: 6px 10px;
        font-size: 0.86rem;
        font-weight: 750;
      }

      .source-pill::before {
        content: "";
        width: 8px;
        height: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--muted);
      }

      .source-pill.is-ok::before {
        background: var(--ok);
      }

      .source-pill.is-warn::before {
        background: var(--amber);
      }

      .source-pill.is-idle::before {
        background: var(--soft-line);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(330px, 0.88fr);
        gap: 16px;
        align-items: start;
      }

      .topic-search {
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }

      .topic-input-row {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 12px;
        align-items: center;
      }

      .topic-input-row input {
        min-height: 58px;
        border: 3px solid var(--ink);
        border-radius: 8px;
        padding: 0 16px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 1.02rem;
        font-weight: 800;
        box-shadow: 3px 3px 0 var(--ink);
      }

      .topic-panel {
        border: 3px solid var(--ink);
        background:
          linear-gradient(90deg, rgba(255, 216, 77, 0.34), transparent 42%),
          var(--paper);
        box-shadow: var(--shadow);
        margin-bottom: 16px;
      }

      .topic-header {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: start;
        flex-wrap: wrap;
      }

      .topic-kicker {
        margin: 4px 0 0;
        color: var(--muted);
        font-weight: 700;
      }

      #topicStatus {
        align-self: start;
        margin-top: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--ink);
        padding: 6px 10px;
        font-weight: 800;
      }

      .api-settings-panel[hidden] {
        display: none;
      }

      .api-settings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .api-settings-grid label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .api-settings-grid input,
      .api-settings-grid select {
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: #fbfcfa;
        color: var(--ink);
        font: inherit;
      }

      .api-settings-grid .wide {
        grid-column: 1 / -1;
      }

      .topic-source-controls,
      .topic-saved {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .topic-source-controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        color: var(--muted);
        font-size: 0.9rem;
        background: rgba(255, 255, 255, 0.72);
      }

      .topic-saved {
        margin-top: 10px;
      }

      .topic-chip {
        display: inline-flex;
        gap: 4px;
      }

      .topic-chip button,
      .topic-source-controls button {
        min-height: 30px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.85rem;
      }

      .panel {
        padding: 16px;
      }

      .panel + .panel {
        margin-top: 16px;
      }

      .panel h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--soft-line);
      }

      .panel h2::before {
        content: "";
        width: 9px;
        height: 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--electric);
      }

      .recommendations {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .papers {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .recommendation,
      .topic-card {
        display: grid;
        grid-template-columns: 46px 1fr;
        gap: 12px;
        padding: 14px;
        border-color: var(--line);
        background: var(--paper);
      }

      .recommendation {
        position: relative;
        overflow: hidden;
      }

      .recommendation::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 5px;
        background: var(--electric);
      }

      .recommendation:first-child {
        background:
          linear-gradient(90deg, rgba(255, 216, 77, 0.22), transparent 48%),
          var(--panel);
      }

      .story-title,
      .paper-title,
      .candidate-title {
        color: var(--ink);
        font-weight: 900;
      }

      .story-title {
        font-size: 1.02rem;
        line-height: 1.32;
      }

      .story-intro,
      .paper-intro,
      .paper-reading {
        color: #514735;
      }

      .paper-reading {
        border-left: 3px solid var(--electric);
        padding-left: 9px;
      }

      .topic-results {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .topic-summary {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .topic-summary strong {
        color: var(--ink);
      }

      .topic-warning {
        border: 1px solid #efd8b8;
        border-radius: 8px;
        background: #fff8ed;
        color: var(--amber);
        padding: 10px;
        font-size: 0.9rem;
      }

      .topic-recommendations {
        display: grid;
        gap: 10px;
      }

      .topic-candidates {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }

      .topic-candidates li {
        display: grid;
        grid-template-columns: 32px 1fr 42px;
        gap: 8px;
        align-items: start;
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
      }

      .topic-candidates li:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .topic-candidates span,
      .topic-candidates em {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .paper {
        border: 1px solid var(--soft-line);
        border-left: 4px solid var(--blue);
        border-radius: 8px;
        background: var(--surface);
        padding: 12px;
      }

      .paper:last-child {
        padding-bottom: 12px;
      }

      .paper-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .paper-actions a,
      .paper-actions button,
      .library-tabs button,
      .library-actions button {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.85rem;
        min-height: 30px;
        background: var(--panel);
      }

      .paper-actions button[data-paper-action="queued"],
      .paper-actions button[data-paper-action="copyCitation"] {
        border-color: var(--ink);
        background: var(--electric-soft);
        color: var(--ink);
        font-weight: 800;
      }

      .paper-actions button.is-active {
        background: var(--electric);
        color: var(--ink);
      }

      .library-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .library-list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .library-item {
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }

      .library-item:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .library-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .note-input {
        width: 100%;
        min-height: 74px;
        margin-top: 10px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfa;
        color: var(--ink);
        font: inherit;
      }

      .empty-state {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 12px;
      }

      .rank {
        align-self: start;
        border-radius: 8px;
        background: var(--electric);
        color: var(--ink);
        font-weight: 800;
        padding: 8px 0;
        text-align: center;
      }

      a {
        color: var(--blue);
        font-weight: 750;
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      a:hover {
        text-decoration: underline;
      }

      p {
        margin: 7px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .intro-label {
        color: var(--ink);
        font-weight: 700;
      }

      .story-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .story-meta span {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
      }

      .candidate-list {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }

      .candidate-list li {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) 48px;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--soft-line);
        border-radius: 8px;
        background: var(--paper);
        padding: 9px 10px;
      }

      .candidate-list li:last-child {
        padding-bottom: 9px;
      }

      .candidate-copy p {
        margin-top: 3px;
        font-size: 0.86rem;
        line-height: 1.42;
      }

      .candidate-copy small {
        display: inline-block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .candidate-list > li > span {
        justify-self: center;
        color: var(--ink);
        font-weight: 900;
      }

      .candidate-list em {
        justify-self: end;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--ink);
        padding: 3px 8px;
        font-style: normal;
        font-weight: 800;
      }

      .candidate-toggle {
        width: 100%;
        margin-top: 12px;
        border-style: dashed;
        color: var(--muted);
      }

      textarea {
        width: 100%;
        min-height: 280px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fbfcfa;
        color: var(--ink);
        font: 0.9rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      @media (max-width: 820px) {
        header,
        .layout {
          grid-template-columns: 1fr;
        }

        header {
          display: grid;
          align-items: start;
        }

        .toolbar {
          justify-content: flex-start;
        }

        .toolbar-actions,
        .export-actions {
          justify-items: start;
          justify-content: flex-start;
          width: 100%;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .topic-input-row {
          grid-template-columns: 1fr;
        }

        .topic-input-row .toolbar,
        .topic-input-row .toolbar button,
        .toolbar-actions .toolbar,
        .toolbar-actions .primary {
          width: 100%;
        }

        .recommendation,
        .topic-card {
          grid-template-columns: 38px 1fr;
        }

        .candidate-list li {
          grid-template-columns: 30px minmax(0, 1fr);
        }

        .candidate-list em {
          grid-column: 2;
          justify-self: start;
        }
      }

      @media (max-width: 520px) {
        main {
          width: min(100vw - 20px, 1240px);
          padding-top: 10px;
        }

        header,
        .topic-panel {
          box-shadow: 3px 3px 0 var(--ink);
        }

        .brand {
          grid-template-columns: 44px minmax(0, 1fr);
        }

        .brand-mark {
          width: 44px;
          height: 44px;
        }

        .api-settings-grid,
        .stats {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 13px;
        }

        .export-actions button,
        .paper-actions a,
        .paper-actions button {
          flex: 1 1 auto;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">Obsession Lab</p>
            <h1>Obsession Radar</h1>
            <div class="subtitle">你的电气科研与技术雷达</div>
            <div class="status" id="statusText">准备中...</div>
            <div class="status status-secondary" id="lastRunText">自动更新：读取中...</div>
          </div>
        </div>
        <div class="toolbar-actions">
          <div class="toolbar">
            <button class="primary" id="refreshButton" type="button">刷新今日雷达</button>
            <button id="apiSettingsButton" type="button">API 设置</button>
          </div>
          <div class="export-actions" aria-label="导出">
            <button id="exportButton" type="button">Markdown</button>
            <button id="exportReadingButton" type="button">精读 Markdown</button>
            <button id="exportBibtexButton" type="button">BibTeX</button>
          </div>
        </div>
      </header>

      <section class="panel api-settings-panel" id="apiSettingsPanel" aria-labelledby="apiSettingsTitle" hidden>
        <h2 id="apiSettingsTitle">API 设置</h2>
        <form id="apiSettingsForm">
          <div class="api-settings-grid">
            <label class="wide">
              <span><input id="apiEnabled" type="checkbox" /> 启用 AI 摘要增强</span>
            </label>
            <label class="wide">
              Base URL
              <input id="apiBaseUrl" type="url" autocomplete="off" placeholder="https://bmapi.020212.xyz" />
              <small>填写 API 根地址，例如 https://bmapi.020212.xyz；不要填写 /keys 管理页面。</small>
            </label>
            <label>
              API Key
              <input id="apiKey" type="password" autocomplete="off" placeholder="只保存在当前浏览器" />
            </label>
            <label>
              Model
              <input id="apiModel" type="text" autocomplete="off" placeholder="gpt-5.5" />
            </label>
            <label>
              接口类型
              <select id="apiWireApi">
                <option value="responses">responses</option>
                <option value="chat_completions">chat_completions</option>
              </select>
            </label>
          </div>
          <div class="toolbar" style="margin-top: 12px; justify-content: flex-start;">
            <button class="primary" type="submit">保存 API 设置</button>
            <button id="apiTestButton" type="button">测试 API</button>
            <button id="apiClearKeyButton" type="button">清除本地 API Key</button>
            <button id="apiCloseButton" type="button">关闭</button>
          </div>
        </form>
        <div class="status status-secondary" id="apiStatus" role="status" aria-live="polite">API 配置只保存在当前浏览器，不会写入日报或部署包。</div>
      </section>

      <section class="stats" id="stats" aria-label="运行统计"></section>
      <section class="source-health" id="sourceHealth" aria-label="来源健康状态"></section>

      <section class="panel topic-panel" aria-labelledby="topicSearchTitle">
        <div class="topic-header">
          <div>
            <h2 id="topicSearchTitle">今日雷达主题</h2>
            <p class="topic-kicker">留空看默认 AI；输入任意方向，就把今日雷达切到你的兴趣场。</p>
          </div>
          <div class="status status-secondary" id="topicStatus">默认 AI 雷达</div>
        </div>
        <form class="topic-search" id="topicForm">
          <div class="topic-input-row">
            <input id="topicInput" type="search" autocomplete="off" aria-label="今日雷达主题" placeholder="留空=默认 AI；或填 robotics / quantum computing / bioinformatics" />
            <div class="toolbar">
              <button id="topicSaveButton" type="button">保存主题</button>
            </div>
          </div>
          <div class="topic-source-controls" aria-label="今日雷达来源">
            <label><input id="topicSourceHn" type="checkbox" checked />HN</label>
            <label><input id="topicSourceGithub" type="checkbox" checked />GitHub</label>
            <label><input id="topicSourceArxiv" type="checkbox" checked />arXiv</label>
            <label><input id="topicSourceSemanticScholar" type="checkbox" checked />Semantic Scholar</label>
          </div>
        </form>
        <div class="topic-saved" id="topicSaved" aria-label="已保存今日雷达主题"></div>
      </section>

      <div class="layout">
        <div>
          <section class="panel" aria-labelledby="recommendationTitle">
            <h2 id="recommendationTitle">5 条推荐</h2>
            <div class="recommendations" id="recommendations"></div>
          </section>

          <section class="panel" id="topicResultsPanel" aria-labelledby="topicRadarTitle">
            <h2 id="topicRadarTitle">当前主题</h2>
            <div class="topic-results" id="topicResults"></div>
          </section>

          <section class="panel" aria-labelledby="paperTitle">
            <h2 id="paperTitle">科研论文</h2>
            <div class="status status-secondary" id="paperStatus"></div>
            <div class="papers" id="papers"></div>
          </section>

          <section class="panel" aria-labelledby="libraryTitle">
            <h2 id="libraryTitle">我的论文库</h2>
            <div class="library-tabs" id="libraryTabs" aria-label="论文库视图">
              <button class="is-active" data-library-view="queued" type="button">精读队列</button>
              <button data-library-view="favorite" type="button">收藏</button>
              <button data-library-view="read" type="button">已读</button>
            </div>
            <div class="library-list" id="paperLibrary"></div>
          </section>
        </div>

        <div>
          <section class="panel" aria-labelledby="candidateTitle">
            <h2 id="candidateTitle">30 条候选</h2>
            <div class="topic-source-controls" id="candidateFilters" aria-label="候选筛选与排序"></div>
            <ol class="candidate-list" id="candidates"></ol>
            <button class="candidate-toggle" id="candidateToggleButton" type="button" hidden>展开全部候选</button>
          </section>

          <section class="panel" aria-labelledby="markdownTitle">
            <h2 id="markdownTitle">Markdown</h2>
            <textarea id="markdownOutput" spellcheck="false" aria-label="Markdown 输出"></textarea>
          </section>
        </div>
      </div>
    </main>
    <script src="./radar-core.browser.js"></script>
    <script src="./paper-library.browser.js"></script>
    <script src="./topic-radar-store.browser.js"></script>
    <script src="./ai-api-config.browser.js"></script>
    <script src="./radar-fetchers.browser.js"></script>
    <script src="./demo-data.js"></script>
    <script src="./last-run-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
